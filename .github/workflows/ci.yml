name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults
      - run: dotnet run --no-build --configuration Release --project tools/ResolveAI.Evals -- --mode fixture --output TestResults/evals-fixture.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The console must not be able to ship header-based development authentication to a real
      # deployment, mirroring the host's refusal to start with it outside Development/Testing.
      - name: Assert development authentication is absent from the production bundle
        run: |
          if grep -rq "X-Development-User" dist; then
            echo "The production bundle contains the development authentication header." >&2
            exit 1
          fi
